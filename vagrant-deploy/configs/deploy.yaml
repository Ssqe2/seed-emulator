# SEED Emulator — Deployment Configuration (常用层)
#
# 这一层是用户每次跑都可能要看/改的核心字段。进阶选项见 advanced.yaml,
# 性能/超时调优见 tuning.yaml。三个文件都被 scripts/gen_deploy_env.py
# 翻译成 SEED_* 环境变量,在 scripts/seed_run.sh 启动时一次注入。
#
# 留空的字段表示"沿用上游 SEED 脚本的默认值",不会被 export。

# --- Profile selection ----------------------------------------------------
# Available profiles defined in seed-emulator/configs/seed_k8s_profiles.yaml:
#   mini_internet | real_topology_rr | real_topology_rr_scale |
#   transit_as | mini_internet_viz | hybrid_kubevirt
profile: custom
namespace: ""                    # SEED_NAMESPACE  (空 = 用 profile 自带的默认)

# 自定义拓扑:profile=custom 时填这个,指向你自己的拓扑 Python 文件。
# 路径相对 vagrant-deploy/ 根 (eg topologies/my_topology.py),也可以指向
# seed-emulator 上游 example (eg ../examples/kubernetes/k8s_nano_internet.py)。
# seed_run.sh 启动时会自动把它注册成上游的 'custom' profile,无需你手动
# 修改 seed-emulator/configs/seed_k8s_profiles.yaml。
topology_file: "../examples/kubernetes/k8s_nano_internet.py"

# CNI 类型(vxlan-overlay / macvlan / ipvlan / bridge / host-local)统一在
# configs/k3s.yaml::cni.type 设定 — 同一个值同时驱动 ansible 在节点上搭什么
# bridge/plugin (infrastructure layer) 和 SEED 编译器 emit 的 NAD type
# (application layer)。两层必须一致,因此单源声明在 k3s.yaml。

# --- scheduling 主选项 ---------------------------------------------------
scheduling:
  # 留空 = 用 profile 自带的默认策略(mini_internet 默认 by_as_hard;
  # transit_as 默认 auto;real_topology_rr 默认 custom)。显式写一个值
  # 会覆盖 profile 默认 — 但要求该 profile 自己 ship 了对应 NODE_LABELS_JSON,
  # 否则 by_as_hard 会断言失败。改 profile 时这里建议留空。
  strategy: ""                   # SEED_SCHEDULING_STRATEGY  by_as_hard | by_as | custom | none | "" = profile default
  placement_mode: ""              # SEED_PLACEMENT_MODE       同上,空 = profile default
  min_nodes_used: 2              # SEED_MIN_NODES_USED
  require_all_nodes: false       # SEED_REQUIRE_ALL_NODES

# --- Topology 主选项 ------------------------------------------------------
topology:
  hosts_per_as: 2                # SEED_HOSTS_PER_AS  (mini_internet 类 profile 用)

# --- Image build & distribution 主选项 ----------------------------------
image:
  pull_policy: Always            # SEED_IMAGE_PULL_POLICY        Always | IfNotPresent | Never
  distribution_mode: registry    # SEED_IMAGE_DISTRIBUTION_MODE  registry | preload

# --- Build 调优 -----------------------------------------------------------
advanced:
  # 控制 SEED 编译器并行跑几个 `docker build`。1 = 串行。
  # 大多数 dev 机器 (4+ 核, 8GB+ RAM) 可以稳跑 4;再高遇 CPU/RAM 瓶颈。
  # 内存紧 (eg WSL 4GB) 调回 2;构建挂了再调回 1。
  #
  # 注意:在 Docker 29 + BuildKit 上,4-way parallel docker build+push
  # 期间(同 host 同时跑 4 个 build,然后并行 push 到本机 registry)
  # 偶发 docker daemon 内部状态在前几秒里 connect 127.0.0.1:5000 全部
  # 返回 "connection refused",尽管 registry container 一直 listening。
  # 5/8 (2026-05-08) WSL+VMware 完整 PASS 那次跑的就是 1,我们保留这条
  # 已验证的默认。改 4 之前请先做 build push baseline。
  build_parallelism: 1           # SEED_BUILD_PARALLELISM
  # 0 = 用 Docker 旧版 builder;1 = 用 BuildKit (Docker 18.09+)。
  # BuildKit 在 Docker 29 上会引入额外的 daemon 内部状态,跟 build 期间
  # 高并发 push 互动出 race(见上)。保持 0 = 跟 5/8 PASS 一致。
  docker_buildkit: 0             # SEED_DOCKER_BUILDKIT
  run_id: ""                     # SEED_RUN_ID  (空 = profile_runner 用时间戳生成)
