# SEED Emulator — Deployment Configuration (常用层)
#
# 这一层是用户每次跑都可能要看/改的核心字段。进阶选项见 advanced.yaml,
# 性能/超时调优见 tuning.yaml。三个文件都被 scripts/gen_deploy_env.py
# 翻译成 SEED_* 环境变量,在 scripts/seed_run.sh 启动时一次注入。
#
# 留空的字段表示"沿用上游 SEED 脚本的默认值",不会被 export。

# --- Profile selection ----------------------------------------------------
# Available profiles defined in seed-emulator/configs/seed_k8s_profiles.yaml:
#   mini_internet | real_topology_rr | real_topology_rr_scale |
#   transit_as | mini_internet_viz | hybrid_kubevirt
profile: custom
namespace: ""                    # SEED_NAMESPACE  (空 = 用 profile 自带的默认)

# 自定义拓扑:profile=custom 时填这个,指向你自己的拓扑 Python 文件。
# 路径相对 vagrant-deploy/ 根 (eg topologies/my_topology.py),也可以指向
# seed-emulator 上游 example (eg ../examples/kubernetes/k8s_nano_internet.py)。
# seed_run.sh 启动时会自动把它注册成上游的 'custom' profile,无需你手动
# 修改 seed-emulator/configs/seed_k8s_profiles.yaml。
topology_file: "../examples/kubernetes/k8s_nano_internet.py"

# --- 编译器开关(yaml 唯一来源)-----------------------------------------
compiler:
  use_multus: true                       # SEED_USE_MULTUS
                                         # SEED 多网卡仿真必需,基本不该关
  internet_map_enabled: false            # SEED_INTERNET_MAP_ENABLED
                                         # true 时拓扑会显式调 attachInternetMap()
                                         # 生成 internet-map Deployment + NodePort Service

  # --- defined by topology file -------------------------------------------
  # 留空 = 用拓扑代码里的默认值;设值 = override 拓扑设置。
  scheduling_strategy: ""                # SEED_SCHEDULING_STRATEGY
                                         # none|auto|by_as|by_as_hard|by_role|custom
  node_labels: ""                        # SEED_NODE_LABELS_JSON
                                         # JSON,e.g. {"150":{"kubernetes.io/hostname":"worker1"}}
  default_resources: ""                  # SEED_DEFAULT_RESOURCES
                                         # JSON,e.g. {"requests":{"cpu":"50m"},"limits":...}

# --- K8s Service 暴露 -----------------------------------------------------
services:
  generate: auto                         # SEED_GENERATE_SERVICES
                                         # auto  = 拓扑暴露端口才生成 Service(setPort)
                                         # false = 强制不生成
  type: NodePort                         # SEED_SERVICE_TYPE
                                         # NodePort | ClusterIP

# --- CNI 部署决策 ---------------------------------------------------------
# cni.type:部署时 SEED secondary network 用哪种 CNI 实现。必须是
# k3s.yaml.cni.install 列表里的一员(集群构建时装好的工具箱)。
# 切 CNI 不需要重装集群,改这里 + seed_all.sh sim 即可。
cni:
  type: vxlan-overlay                    # SEED_CNI_TYPE
                                         # bridge | macvlan | ipvlan | vxlan-overlay | host-local
  local_link_cni_type: ""                # SEED_LOCAL_LINK_CNI_TYPE  defined by topology
                                         # 留空走自动 fallback(BY_AS_HARD+macvlan→bridge 等)

# --- Image build & distribution 主选项 ----------------------------------
image:
  pull_policy: Always            # SEED_IMAGE_PULL_POLICY        Always | IfNotPresent | Never
  distribution_mode: registry    # SEED_IMAGE_DISTRIBUTION_MODE  registry | preload

# --- Build 调优 -----------------------------------------------------------
advanced:
  # 控制 SEED 编译器并行跑几个 `docker build`。1 = 串行。
  # 大多数 dev 机器 (4+ 核, 8GB+ RAM) 可以稳跑 4;再高遇 CPU/RAM 瓶颈。
  # 内存紧 (eg WSL 4GB) 调回 2;构建挂了再调回 1。
  build_parallelism: 4           # SEED_BUILD_PARALLELISM
  # 0 = 用 Docker 旧版 builder;1 = 用 BuildKit (Docker 18.09+,默认所有现代版本都支持)。
  # BuildKit 显著更快:并行 layer 构建 + 更好缓存 + 跳过未用 stage。
  # 几乎没理由关,除非 Docker 太老或撞特定 bug。
  docker_buildkit: 1             # SEED_DOCKER_BUILDKIT
  run_id: ""                     # SEED_RUN_ID  (空 = profile_runner 用时间戳生成)
