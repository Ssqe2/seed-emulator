# SEED Emulator — Dependency Declaration
#
# Read by scripts/install_deps.sh; checked by seed_all.sh stage 0 preflight.
# Each Python package may specify a pip-style version constraint (e.g.
# "jinja2<3.1"). CLI tools are checked for presence in $PATH only — they are
# NOT auto-installed (system packages need root or specific install methods).
#
# When a CLI is missing the user is shown the matching `install_hints` entry.

python_packages:
  - pyyaml
  # ansible 2.10.x uses jinja2's `environmentfilter`, removed in 3.1+.
  # Pin to < 3.1 until we upgrade the playbook stack to ansible-core >= 2.13.
  - "jinja2<3.1"
  # SEED upstream seedemu imports `requests` at module load (eg
  # AutonomousSystem.py). Linux distro pythons usually ship it; macOS
  # brew python doesn't.
  - requests

cli_required:
  - vagrant
  - ansible-playbook
  - kubectl
  - python3
  - ssh
  - scp

install_hints:
  vagrant: "https://developer.hashicorp.com/vagrant/install (Linux: sudo apt install vagrant; Mac: brew install --cask vagrant)"
  ansible-playbook: "Linux: sudo apt install ansible; Mac: brew install ansible"
  kubectl: "Linux: curl -fsSL --create-dirs -o ~/.local/bin/kubectl https://files.m.daocloud.io/dl.k8s.io/release/v1.28.5/bin/linux/amd64/kubectl && chmod +x ~/.local/bin/kubectl; Mac: brew install kubernetes-cli"
  python3: "Linux: sudo apt install python3 python3-yaml; Mac: brew install python3"
  ssh: "sudo apt install openssh-client (Mac built-in)"
  scp: "sudo apt install openssh-client (Mac built-in)"

# -----------------------------------------------------------------------------
# Per-vagrant-provider dependencies.
#
# Read cluster.yaml's `provider` field at preflight time, dispatch to the
# matching block below, validate every requirement. `install_deps.sh check`
# only reports issues; `install_deps.sh install` will additionally try to
# auto-start any daemon listed under `daemons` (sudo launchctl on macOS,
# sudo systemctl on Linux).
#
# Sections inside each provider:
#   vagrant_plugins  — `vagrant plugin list` must show each
#   cli              — extra binaries that must be in $PATH
#   files            — paths that must exist (eg helper certificates)
#   apps             — at least one of the listed paths exists (multi-platform)
#   daemons          — background services; probed via shell command, started
#                      via the platform-specific `ensure_*` command
# -----------------------------------------------------------------------------
provider_dependencies:
  vmware_desktop:
    vagrant_plugins:
      - vagrant-vmware-desktop
    files:
      # Skipped on WSL: the helper daemon lives on the Windows host (where
      # VMware Workstation actually runs); the Linux side has no cert to
      # check. Mac and native Linux both install Hashicorp's utility under
      # /opt/vagrant-vmware-desktop/.
      - path: /opt/vagrant-vmware-desktop/certificates/vagrant-utility.client.crt
        platforms: [macos, linux_native]
        purpose: "Vagrant VMware Utility (helper daemon plugin uses to talk to Fusion/Workstation)"
        install_hint: "Mac: brew install --cask vagrant-vmware-utility | other: download .pkg from https://developer.hashicorp.com/vagrant/install/vmware"
    daemons:
      # WSL skip rationale: see `files` block above.
      - name: vagrant-vmware-utility
        platforms: [macos, linux_native]
        # vagrant-vmware-utility uses mTLS. We don't care which HTTP code the
        # endpoint returns (some versions answer 200, others 403 for /status);
        # what matters is that the TCP+TLS handshake succeeded — which means
        # the daemon is running and our client cert is accepted. Anything
        # other than '000' (curl's "no connection" placeholder) qualifies.
        probe: "code=$(curl -sk --cert /opt/vagrant-vmware-desktop/certificates/vagrant-utility.client.crt --key /opt/vagrant-vmware-desktop/certificates/vagrant-utility.client.key -o /dev/null -w '%{http_code}' --max-time 5 https://127.0.0.1:9922/ 2>/dev/null); [ -n \"$code\" ] && [ \"$code\" != \"000\" ] && echo OK || echo FAIL"
        expected: "OK"
        # macOS Sequoia/Sonoma deprecated `launchctl load`; use `bootstrap`
        # (idempotent, errors ignored if already bootstrapped) + `kickstart`
        # to force the service to actually start. Both need root.
        ensure_macos: "sudo launchctl bootstrap system /Library/LaunchDaemons/com.vagrant.vagrant-vmware-utility.plist 2>/dev/null; sudo launchctl kickstart -k system/com.vagrant.vagrant-vmware-utility"
        ensure_linux: "sudo systemctl start vagrant-vmware-utility"
  virtualbox:
    vagrant_plugins: []      # provider built into vagrant
    # vboxmanage is validated via provider_settings.yaml bin_dir, not via PATH check
    # (WSL users have it on the Windows side, not in WSL PATH).
  libvirt:
    vagrant_plugins:
      - vagrant-libvirt
    # virsh is validated via provider_settings.yaml bin_dir.
