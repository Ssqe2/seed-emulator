# SEED Emulator — VM Cluster Configuration
# Used by scripts/seed_vagrant.sh to create VMs via Vagrant

provider: vmware_desktop

# Box selection per host architecture. seed_vagrant.sh resolves at generate
# time: if `uname -m` matches one of the keys below, that box is used;
# otherwise `box` is the default.
#   x86_64 / amd64 host  → `box`
#   arm64 / aarch64 host → `box_arm64`
# Apple Silicon Macs (M1+) need an ARM box because VMware Fusion 13+ on
# arm64 cannot run x86_64 guests.
box: generic/ubuntu2204
box_arm64: gyptazy/ubuntu22.04-arm64

network:
  type: private_network

# Enable CPU virtualization extensions passthrough to guest VMs.
# Required when running Vagrant + a hypervisor (libvirt/KVM/VirtualBox) inside the guest.
nested_virt: false

nodes:
  - name: master
    role: master
    cpus: 2
    memory: 4096
    ip: 192.168.77.10

  - name: worker1
    role: worker
    cpus: 2
    memory: 2048
    ip: 192.168.77.11

  - name: worker2
    role: worker
    cpus: 2
    memory: 2048
    ip: 192.168.77.12
