[defaults]
host_key_checking = False
retry_files_enabled = False
# YAML output: in ansible-core 2.13+ use the builtin 'default' callback with
# result_format=yaml. The old 'community.general.yaml' plugin was removed in
# community.general 12.0.0 (the version brew installs on Mac as of 2026).
stdout_callback = default
result_format = yaml
deprecation_warnings = False
# Let ansible auto-discover python on each host instead of pinning to
# /usr/bin/python3 — Mac's system python may not exist or differ from brew.
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
