---
# SEED Emulator — K3s cluster setup playbook
# Mirrors the logic of the original scripts/seed_k3s_setup.sh:
#   - Install K3s server on master, agent on workers (with node-ip / advertise-address /
#     flannel-iface bound to the private network interface)
#   - Install Multus CNI (with K3s-specific path patches and RBAC fix)
#   - Install macvlan/ipvlan/static CNI plugins on every node
#   - Set up a Docker private image registry on master
#   - Fetch kubeconfig and run a final sanity check
#
# Variables come from the inventory generated by scripts/gen_inventory.py.

# -----------------------------------------------------------------------------
# Step 0 : detect the network interface that owns each node's cluster IP. We
# could not put this in the inventory because each node must be probed via SSH.
# -----------------------------------------------------------------------------
- name: Detect cluster network interface on every node
  hosts: all
  gather_facts: false
  tasks:
    - name: Find the interface holding {{ node_ip }}
      ansible.builtin.shell:
        cmd: "ip -o addr show | awk -v ip='{{ node_ip }}' '$0 ~ ip\"/\" {print $2; exit}'"
      register: iface_lookup
      changed_when: false

    - name: Fail if no interface owns the node IP
      ansible.builtin.fail:
        msg: "No interface holds {{ node_ip }} on {{ inventory_hostname }}"
      when: iface_lookup.stdout | length == 0

    - name: Set flannel_iface fact
      ansible.builtin.set_fact:
        flannel_iface: "{{ iface_lookup.stdout }}"

# -----------------------------------------------------------------------------
# Step 0.5 : propagate proxy from controller to every VM's /etc/environment so
# user shells / curl / wget / git on the VM all honour it transparently. Empty
# proxy (direct-connect users) → task skipped via the `when:` guard.
# -----------------------------------------------------------------------------
- name: Configure proxy + DNS on all hosts
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Set proxy env in /etc/environment
      ansible.builtin.lineinfile:
        path: /etc/environment
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        state: present
      loop:
        - { key: HTTP_PROXY,  value: "{{ proxy_http }}" }
        - { key: HTTPS_PROXY, value: "{{ proxy_https }}" }
        - { key: NO_PROXY,    value: "{{ proxy_no_proxy }}" }
        - { key: http_proxy,  value: "{{ proxy_http }}" }
        - { key: https_proxy, value: "{{ proxy_https }}" }
        - { key: no_proxy,    value: "{{ proxy_no_proxy }}" }
      when: (proxy_https | length > 0) or (proxy_http | length > 0)

    # The VM ships with systemd-resolved DNSSEC=yes + vmnet stub upstream.
    # When the host uses mihomo / clash TUN-mode (which the VM's traffic
    # transparently passes through), the proxy returns fake-ip DNS responses
    # that aren't DNSSEC-signed → resolver rejects them → "Could not resolve
    # host". Replace resolved.conf so:
    #   * DNSSEC is off (so fake-ip is accepted)
    #   * DNS upstreams are public resolvers (so queries hit TUN instead of
    #     getting trapped in the vmnet DNS stub)
    # Always applied — harmless when no TUN is in use (DNSSEC isn't strictly
    # required for our use case, and 1.1.1.1/223.5.5.5 are universally reachable).
    - name: Configure systemd-resolved (DNSSEC off + public DNS)
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf
        mode: "0644"
        content: |
          [Resolve]
          DNSSEC=no
          DNS=223.5.5.5 1.1.1.1
          FallbackDNS=119.29.29.29 8.8.8.8

    - name: Restart systemd-resolved to pick up new config
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted

# -----------------------------------------------------------------------------
# Step 1 : install K3s server on the master
# -----------------------------------------------------------------------------
- name: Install K3s server on master
  hosts: master
  environment: "{{ http_proxy_env }}"
  gather_facts: false
  become: true
  tasks:
    - name: Ensure /etc/rancher/k3s exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Render K3s server config
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0644"
        content: |
          write-kubeconfig-mode: "644"
          node-ip: "{{ node_ip }}"
          advertise-address: "{{ node_ip }}"
          tls-san:
            - "{{ node_ip }}"
            - "127.0.0.1"           # so controller-side kubectl via host port-forward verifies
            - "localhost"
          flannel-backend: {{ k3s_flannel_backend }}
          flannel-iface: {{ flannel_iface }}
          disable:
            - traefik
          cluster-cidr: "{{ k3s_cluster_cidr }}"
          service-cidr: "{{ k3s_service_cidr }}"
          kubelet-arg:
            - "max-pods={{ k3s_max_pods }}"
      notify: restart k3s server

    - name: Render registries.yaml
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/registries.yaml
        mode: "0644"
        content: "{{ registries_yaml_content }}"

    - name: Run K3s install script
      ansible.builtin.shell: >
        curl -sfL '{{ k3s_install_url }}' |
        {{ k3s_install_mirror_env }} INSTALL_K3S_VERSION='{{ k3s_version }}' sh -
      args:
        creates: /usr/local/bin/k3s

    # The install script can exit 0 even when its curl/download silently fails
    # (transient SSH/network glitches during Stage 1).  Verify the binary
    # actually landed before we go further — otherwise downstream `Wait for
    # K3s API readiness` would loop for 60 retries before giving up with a
    # generic "non-zero return code".
    - name: Verify K3s server binary is installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_server_binary

    - name: Fail clearly if K3s server install did not land
      ansible.builtin.assert:
        that: k3s_server_binary.stat.exists
        fail_msg: >-
          K3s server install task reported success but /usr/local/bin/k3s does
          not exist on master. The install script likely failed silently
          (network drop / SSH glitch). Re-run: bash scripts/seed_all.sh k3s

    - name: Wait for K3s API readiness
      ansible.builtin.shell:
        cmd: k3s kubectl get nodes
      register: k3s_ready
      retries: 30
      delay: 2
      until: k3s_ready.rc == 0
      changed_when: false

    - name: Read K3s join token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_b64

    - name: Expose token + master_ip as facts for later plays
      ansible.builtin.set_fact:
        k3s_join_token: "{{ k3s_token_b64.content | b64decode | trim }}"
        master_node_ip: "{{ node_ip }}"
  handlers:
    - name: restart k3s server
      ansible.builtin.systemd:
        name: k3s
        state: restarted

# -----------------------------------------------------------------------------
# Step 2 : install K3s agent on every worker
# -----------------------------------------------------------------------------
- name: Install K3s agent on workers
  hosts: workers
  environment: "{{ http_proxy_env }}"
  gather_facts: false
  become: true
  vars:
    master_ip: "{{ hostvars[groups['master'][0]].master_node_ip }}"
    join_token: "{{ hostvars[groups['master'][0]].k3s_join_token }}"
  tasks:
    - name: Ensure /etc/rancher/k3s exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Render K3s agent config
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0644"
        content: |
          node-ip: "{{ node_ip }}"
          flannel-iface: {{ flannel_iface }}
          kubelet-arg:
            - "max-pods={{ k3s_max_pods }}"

    - name: Render registries.yaml
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/registries.yaml
        mode: "0644"
        content: "{{ registries_yaml_content }}"

    - name: Run K3s install script (agent)
      ansible.builtin.shell: >
        curl -sfL '{{ k3s_install_url }}' |
        {{ k3s_install_mirror_env }} INSTALL_K3S_VERSION='{{ k3s_version }}'
        K3S_URL='https://{{ master_ip }}:6443'
        K3S_TOKEN='{{ join_token }}' sh -
      args:
        creates: /usr/local/bin/k3s

    # Same silent-failure guard as the master.  If a worker's install script
    # gets cut off mid-download (Vagrant SSH glitch / transient network drop)
    # ansible reports `changed`, but the binary never lands.  Catch that
    # here so Stage 2 fails fast with a clear pointer instead of confusingly
    # timing out at "Poll kubectl until expected node count is Ready".
    - name: Verify K3s agent binary is installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_agent_binary

    - name: Fail clearly if K3s agent install did not land
      ansible.builtin.assert:
        that: k3s_agent_binary.stat.exists
        fail_msg: >-
          K3s agent install task reported success but /usr/local/bin/k3s does
          not exist on this worker. Re-run: bash scripts/seed_all.sh k3s

# -----------------------------------------------------------------------------
# Step 3 : wait for every node to reach Ready
# -----------------------------------------------------------------------------
- name: Wait for every node to be Ready
  hosts: master
  gather_facts: false
  become: true
  tasks:
    - name: Poll kubectl until expected node count is Ready
      ansible.builtin.shell:
        cmd: |
          ready=$(k3s kubectl get nodes --no-headers 2>/dev/null | grep -c ' Ready ')
          [ "$ready" -ge "{{ groups['all'] | length }}" ]
      register: nodes_ready
      retries: 60
      delay: 2
      until: nodes_ready.rc == 0
      changed_when: false

    - name: Show final node list
      ansible.builtin.shell:
        cmd: k3s kubectl get nodes -o wide
      register: nodes_wide
      changed_when: false

    - name: Print node table
      ansible.builtin.debug:
        msg: "{{ nodes_wide.stdout_lines }}"

# -----------------------------------------------------------------------------
# Step 3.5 : prepare VXLAN overlay infrastructure for cross-node IX networks
#
# SEED Emulator's InternetExchange networks model real-world peering LANs
# (router pods all on the same L2 segment). Cross-worker macvlan/ipvlan L2
# fails on hypervisors that don't allow vmnet promiscuous mode (VMware
# Workstation, default VirtualBox). We solve it the same way every K8s
# overlay plugin does: per-IX VXLAN tunnel between K3s nodes, terminating
# in a host bridge that the SEED-generated NAD attaches pods to.
#
# This step prepares only the *infrastructure* (vxlan kernel module +
# sysctls + node labels). The actual `br-<ix>` and `vxlan-<ix>` interfaces
# are created at deploy-time by a SEED-emitted DaemonSet that knows the
# concrete IX list (encoded by the compiler). See PR-E Phase 2.
# -----------------------------------------------------------------------------
- name: Prepare VXLAN overlay infrastructure on all K3s nodes
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Load vxlan kernel module
      community.general.modprobe:
        name: vxlan
        state: present
      ignore_errors: true

    - name: Fallback modprobe via shell (community.general not always present)
      ansible.builtin.shell: modprobe vxlan
      changed_when: false
      failed_when: false

    - name: Persist vxlan module load across reboots
      ansible.builtin.copy:
        dest: /etc/modules-load.d/seed-vxlan.conf
        mode: "0644"
        content: |
          vxlan

    - name: Disable bridge-nf-call-iptables (don't filter L2 frames through netfilter)
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "0"
        state: present
        sysctl_set: true
        reload: true
      loop:
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-ip6tables
      ignore_errors: true

    - name: Fallback sysctl via shell (ansible.posix not always present)
      ansible.builtin.shell: |
        sysctl -w net.bridge.bridge-nf-call-iptables=0 || true
        sysctl -w net.bridge.bridge-nf-call-ip6tables=0 || true
      changed_when: false

- name: Label every K3s node with its private IP (for VXLAN FDB peer discovery)
  hosts: master
  gather_facts: false
  become: true
  tasks:
    - name: Apply seed-private-ip label to each node
      ansible.builtin.shell: |
        k3s kubectl label node {{ item }} \
          seed-private-ip={{ hostvars[item].node_ip }} --overwrite
      loop: "{{ groups['all'] }}"
      changed_when: false

# Step 3.6 was previously here — it created hard-coded VXLAN bridges for
# IX100..IX105 (mini_internet's IX list). That has now been replaced by a
# DaemonSet emitted by the SEED Kubernetes compiler, which dynamically
# enumerates every cross-node SEED network (IX + Local + CrossConnect) and
# creates the corresponding `br-<key>` + `vxlan-<key>` on every node at
# deploy time. The infrastructure prep (modprobe, sysctls, seed-private-ip
# label) above is the only ansible-side responsibility — actual bridge/vxlan
# lifecycle lives in the per-namespace DaemonSet now.
# -----------------------------------------------------------------------------
# Step 4 : install Multus CNI (with K3s path patches + RBAC fix)
# -----------------------------------------------------------------------------
- name: Install Multus CNI
  hosts: master
  environment: "{{ http_proxy_env }}"
  gather_facts: false
  become: true
  tasks:
    - name: Skip if Multus disabled in k3s.yaml
      ansible.builtin.meta: end_play
      when: not multus_install

    - name: Check whether Multus DaemonSet already exists
      ansible.builtin.shell:
        cmd: k3s kubectl -n kube-system get ds kube-multus-ds
      register: multus_ds
      failed_when: false
      changed_when: false

    - name: Download upstream Multus daemonset manifest
      ansible.builtin.get_url:
        url: "{{ multus_manifest_url }}"
        dest: /tmp/multus-daemonset.yml
        mode: "0644"
        force: true
        timeout: 30
      retries: 3
      delay: 10
      register: multus_dl
      until: multus_dl is succeeded
      when: multus_ds.rc != 0

    - name: Patch Multus manifest (kubeconfig path)
      ansible.builtin.replace:
        path: /tmp/multus-daemonset.yml
        regexp: '"kubeconfig": "/etc/cni/net.d/multus.d/multus.kubeconfig"'
        replace: '"kubeconfig": "/var/lib/rancher/k3s/agent/etc/cni/net.d/multus.d/multus.kubeconfig"'
      when: multus_ds.rc != 0

    - name: Patch Multus manifest (cni config dir)
      ansible.builtin.replace:
        path: /tmp/multus-daemonset.yml
        regexp: 'path: /etc/cni/net.d$'
        replace: 'path: /var/lib/rancher/k3s/agent/etc/cni/net.d'
      when: multus_ds.rc != 0

    - name: Patch Multus manifest (cni bin dir)
      ansible.builtin.replace:
        path: /tmp/multus-daemonset.yml
        regexp: 'path: /opt/cni/bin$'
        replace: 'path: /var/lib/rancher/k3s/data/current/bin'
      when: multus_ds.rc != 0

    - name: Patch Multus manifest (kubeconfig host arg)
      ansible.builtin.replace:
        path: /tmp/multus-daemonset.yml
        regexp: '"--multus-autoconfig-dir=/host/etc/cni/net.d"'
        replace: |-
          "--multus-autoconfig-dir=/host/etc/cni/net.d"
                  - "--multus-kubeconfig-file-host=/var/lib/rancher/k3s/agent/etc/cni/net.d/multus.d/multus.kubeconfig"
      when: multus_ds.rc != 0

    - name: Apply Multus manifest
      ansible.builtin.shell:
        cmd: k3s kubectl apply -f /tmp/multus-daemonset.yml
      when: multus_ds.rc != 0

    - name: Apply Multus RBAC patch
      ansible.builtin.shell:
        cmd: k3s kubectl apply -f -
        stdin: |
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: multus
          rules:
          - apiGroups: ["k8s.cni.cncf.io"]
            resources: ["*"]
            verbs: ["*"]
          - apiGroups: [""]
            resources: ["pods", "pods/status"]
            verbs: ["get", "list", "watch", "update"]
          - apiGroups: ["", "events.k8s.io"]
            resources: ["events"]
            verbs: ["create", "patch", "update"]
      when: multus_rbac_patch

    - name: Wait for Multus DaemonSet to be ready
      ansible.builtin.shell:
        cmd: k3s kubectl -n kube-system rollout status ds/kube-multus-ds --timeout=300s
      changed_when: false

# -----------------------------------------------------------------------------
# Step 5 : install macvlan/ipvlan/static CNI plugins on every node
# -----------------------------------------------------------------------------
- name: Install extra CNI plugins (macvlan / ipvlan / static)
  hosts: all
  environment: "{{ http_proxy_env }}"
  gather_facts: false
  become: true
  vars:
    cni_bin_dir: /var/lib/rancher/k3s/data/current/bin
    cni_archive_url: >-
      {{ cni_plugins_base }}/{{ cni_plugins_version }}/cni-plugins-linux-amd64-{{ cni_plugins_version }}.tgz
  tasks:
    - name: Skip when cni.type does not need extra plugins
      ansible.builtin.meta: end_play
      when: cni_type not in ['macvlan', 'ipvlan']

    - name: Check whether macvlan is already installed
      ansible.builtin.stat:
        path: "{{ cni_bin_dir }}/macvlan"
      register: macvlan_bin

    - name: Download CNI plugins tarball
      ansible.builtin.get_url:
        url: "{{ cni_archive_url }}"
        dest: /tmp/cni-plugins.tgz
        mode: "0644"
      when: not macvlan_bin.stat.exists

    - name: Create extraction directory
      ansible.builtin.file:
        path: /tmp/cni-extract
        state: directory
        mode: "0755"
      when: not macvlan_bin.stat.exists

    - name: Extract CNI plugins tarball
      ansible.builtin.unarchive:
        src: /tmp/cni-plugins.tgz
        dest: /tmp/cni-extract
        remote_src: true
      when: not macvlan_bin.stat.exists

    - name: Install plugin {{ item }}
      ansible.builtin.copy:
        src: "/tmp/cni-extract/{{ item }}"
        dest: "{{ cni_bin_dir }}/{{ item }}"
        mode: "0755"
        remote_src: true
      loop:
        - macvlan
        - ipvlan
        - static
      when: not macvlan_bin.stat.exists

    - name: Clean up extraction artifacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/cni-plugins.tgz
        - /tmp/cni-extract
      when: not macvlan_bin.stat.exists

    # Upstream `validate_k3s_mini_internet_multinode.sh` preflight checks
    # /opt/cni/bin/<plugin> first, only falls back to K3s bin via `||`. Even
    # though the fallback works on paper, when /opt/cni/bin is missing
    # entirely (fresh worker), the upstream "quick remediation" step kicks
    # in and runs `apt-get install -y containernetworking-plugins` over the
    # default Ubuntu mirrors — which times out for tens of minutes in CN.
    # Pre-create the symlinks so preflight passes cleanly and remediation
    # never triggers.
    - name: Ensure /opt/cni/bin exists (upstream preflight scans here)
      ansible.builtin.file:
        path: /opt/cni/bin
        state: directory
        mode: "0755"

    - name: Symlink CNI plugins into /opt/cni/bin (upstream-preflight compatibility)
      ansible.builtin.file:
        src: "{{ cni_bin_dir }}/{{ item }}"
        dest: "/opt/cni/bin/{{ item }}"
        state: link
        force: true
      loop:
        - macvlan
        - ipvlan
        - static

# -----------------------------------------------------------------------------
# Step 6 : install Docker + run a private registry on master
# -----------------------------------------------------------------------------
- name: Install Docker and start the private registry on master
  hosts: master
  environment: "{{ http_proxy_env }}"
  gather_facts: false
  become: true
  tasks:
    - name: Check whether docker is already installed
      ansible.builtin.command:
        cmd: which docker
      register: docker_present
      changed_when: false
      failed_when: false

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        update_cache: true
      when: docker_present.rc != 0

    - name: Ensure /etc/apt/keyrings exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: docker_present.rc != 0

    - name: Detect Ubuntu codename
      ansible.builtin.shell:
        cmd: . /etc/os-release && echo $VERSION_CODENAME
      register: codename
      changed_when: false
      when: docker_present.rc != 0

    - name: Detect dpkg architecture (amd64 / arm64)
      ansible.builtin.shell:
        cmd: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false
      when: docker_present.rc != 0

    - name: Fetch Aliyun Docker GPG key
      ansible.builtin.get_url:
        url: https://mirrors.aliyun.com/docker-ce/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: true
      when:
        - docker_present.rc != 0
        - docker_install_method == 'aliyun'

    - name: Convert Aliyun GPG key to dearmored form
      ansible.builtin.shell:
        cmd: gpg --batch --yes --dearmor -o /etc/apt/keyrings/docker.gpg /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.gpg
      when:
        - docker_present.rc != 0
        - docker_install_method == 'aliyun'

    - name: Configure Aliyun Docker apt source
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.list
        mode: "0644"
        content: |
          deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.gpg] https://mirrors.aliyun.com/docker-ce/linux/ubuntu {{ codename.stdout }} stable
      when:
        - docker_present.rc != 0
        - docker_install_method == 'aliyun'

    - name: Install Docker (aliyun)
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive
      when:
        - docker_present.rc != 0
        - docker_install_method == 'aliyun'

    - name: Install Docker (official one-liner)
      ansible.builtin.shell:
        cmd: curl -fsSL https://get.docker.com | sh
      when:
        - docker_present.rc != 0
        - docker_install_method == 'official'

    - name: Configure Docker daemon mirror + insecure local registry
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: "{{ docker_daemon_config | to_json }}"
      vars:
        docker_daemon_config:
          registry-mirrors: "{{ docker_daemon_mirrors }}"
          # Local registry serves over plain HTTP — Docker would otherwise
          # refuse to push (`layer Unavailable`).  Listing all three
          # endpoints (master IP / 127.0.0.1 / localhost) here lets SEED's
          # `seed_run.sh build` push freshly-built router/host images via
          # whichever loopback name the build_images.sh shim chooses, AND
          # avoids a later `systemctl restart docker` from
          # build_images.sh::ensure_docker_daemon_config — that restart
          # used to take the registry container down for several seconds,
          # making the very first build push see "connection refused"
          # before retrying.
          insecure-registries:
            - "{{ registry_host }}:{{ registry_port }}"
            - "127.0.0.1:{{ registry_port }}"
            - "localhost:{{ registry_port }}"
      notify: restart docker

    # If the user configured a proxy in configs/proxy_settings.yaml, write it
    # into docker daemon's systemd drop-in. Without this, `docker pull` for
    # SEED image build (base layers like ubuntu:22.04) ignores
    # HTTP_PROXY/HTTPS_PROXY (dockerd is its own systemd service and doesn't
    # inherit shell env). Skipped when proxy is empty.
    - name: Ensure docker systemd drop-in dir exists
      ansible.builtin.file:
        path: /etc/systemd/system/docker.service.d
        state: directory
        mode: "0755"
      when: (proxy_https | length > 0) or (proxy_http | length > 0)

    - name: Configure docker daemon proxy
      ansible.builtin.copy:
        dest: /etc/systemd/system/docker.service.d/http-proxy.conf
        mode: "0644"
        content: |
          [Service]
          Environment="HTTP_PROXY={{ proxy_http }}"
          Environment="HTTPS_PROXY={{ proxy_https }}"
          Environment="NO_PROXY={{ proxy_no_proxy }}"
      when: (proxy_https | length > 0) or (proxy_http | length > 0)
      notify: restart docker

    - name: Force handler flush so Docker restarts before we start the registry
      ansible.builtin.meta: flush_handlers

    - name: Ensure Docker is running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Remove any pre-existing registry container
      ansible.builtin.shell:
        cmd: docker rm -f registry
      register: rm_registry
      changed_when: rm_registry.rc == 0
      failed_when: false

    - name: Start registry container
      ansible.builtin.shell:
        cmd: >
          docker run -d --network host --restart=always --name registry
          -e REGISTRY_HTTP_ADDR=0.0.0.0:{{ registry_port }} registry:2

    - name: Wait for registry HTTP endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ registry_port }}/v2/"
        status_code: 200
      register: registry_probe
      retries: 15
      delay: 2
      until: registry_probe.status == 200
  handlers:
    - name: restart docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

# -----------------------------------------------------------------------------
# Step 7 : fetch kubeconfig back to the controller machine
# -----------------------------------------------------------------------------
- name: Fetch kubeconfig from master
  hosts: master
  gather_facts: false
  become: true
  tasks:
    - name: Read /etc/rancher/k3s/k3s.yaml
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_b64

    - name: Save kubeconfig to controller, rewriting server to forwarded host port
      ansible.builtin.copy:
        dest: "{{ output_kubeconfig }}"
        mode: "0644"
        # K3s writes server: https://127.0.0.1:6443. The controller cannot
        # reach the cluster's private IP (e.g. 192.168.77.10) when run from
        # WSL, so we rewrite to the vagrant-forwarded host port (16443).
        # The cert's tls-san includes 127.0.0.1, so TLS verification works.
        content: "{{ kubeconfig_b64.content | b64decode | replace('https://127.0.0.1:6443', 'https://127.0.0.1:16443') }}"
      delegate_to: localhost
      become: false

# -----------------------------------------------------------------------------
# Step 8 : final sanity check
# -----------------------------------------------------------------------------
- name: Validate cluster
  hosts: master
  gather_facts: false
  become: true
  tasks:
    - name: Get nodes
      ansible.builtin.shell:
        cmd: k3s kubectl get nodes -o wide
      register: final_nodes
      changed_when: false

    - name: Show nodes
      ansible.builtin.debug:
        msg: "{{ final_nodes.stdout_lines }}"

    - name: Confirm Multus DaemonSet exists (when enabled)
      ansible.builtin.shell:
        cmd: k3s kubectl -n kube-system get ds kube-multus-ds
      register: multus_check
      changed_when: false
      failed_when: false
      when: multus_install

    - name: Confirm registry endpoint is reachable
      ansible.builtin.uri:
        url: "http://localhost:{{ registry_port }}/v2/"
        status_code: 200

# -----------------------------------------------------------------------------
# Step 9 : export the master's flannel interface to the controller, so the
# wrapper can plug it into the SEED compiler's cluster description file.
# -----------------------------------------------------------------------------
- name: Export master CNI interface to controller
  hosts: master
  gather_facts: false
  tasks:
    - name: Write detected interface to {{ output_cni_iface }}
      ansible.builtin.copy:
        dest: "{{ output_cni_iface }}"
        mode: "0644"
        content: "{{ flannel_iface }}"
      delegate_to: localhost
      become: false
